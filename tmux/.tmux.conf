# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Kanagawa Dragon theme
set -g @plugin 'obergodmar/kanagawa-tmux'

# Copy to system clipboard (works in Blink Shell over mosh)
set -g @plugin 'tmux-plugins/tmux-yank'
set -g mode-keys vi
set -g set-clipboard on

# Copy mode selections work like vim's visual modes. tmux's vi defaults have v as
# rectangle-toggle and only Space starting a selection.
#   v      characterwise; from a block selection switches back, otherwise v again cancels
#   V      linewise (tmux default, unchanged)
#   C-v    blockwise; switches an existing selection to block
# y (tmux-yank: copy to clipboard and leave), Escape (clear selection) and o (other
# end) already match vim.
# selection_active, not selection_present: present stays 0 until the cursor moves off
# the start. The rectangle flag outlives the selection, so v turns it off explicitly.
bind -T copy-mode-vi v if -F '#{selection_active}' \
  "if -F '#{rectangle_toggle}' 'send -X rectangle-off' 'send -X clear-selection'" \
  'send -X begin-selection ; send -X rectangle-off'
bind -T copy-mode-vi C-v if -F '#{selection_active}' \
  'send -X rectangle-on' \
  'send -X begin-selection ; send -X rectangle-on'

set -g mouse on

# Change prefix from C-b to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -sg escape-time 10   # prevents Esc delay in Neovim
set -g window-size latest  # resize to most recently active client

# True color support for Ghostty
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB"
set -ga terminal-overrides ",*256col*:RGB"

# Pass OSC 8 hyperlinks through to the outer terminal, so links printed by
# programs inside tmux (e.g. obsidian:// links from Claude Code) are clickable
set -as terminal-features ",*:hyperlinks"

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

# --- Status bar overrides (must stay after TPM init) ---
# Bar backgrounds use the terminal's default color instead of Kanagawa's #181616,
# so each client fills them with its own: Ghostty's theme on the Mac, pure black
# from the Blink theme on the iPad (OLED). The #282727 pills keep their color.
# status-bg "default" means "use status-style", whose own default is bg=green, so
# both have to be set. fg stays black, what the theme left it as.
set -g status-bg default
set -g status-style "fg=black,bg=default"
setw -g window-status-style "fg=#c5c9c5,bg=default,none"
setw -g window-status-activity-style "fg=#c5c9c5,bg=default,none"
# Session name moved to the far left, brightened, orange on prefix (C-a)
# Agent notifications come straight from the window options tmux-agent-notify sets
# (#{S:#{W:...}} loops over every window), so no command runs on each redraw
set -g status-left "#{?client_prefix,#[fg=#ffa066],#[fg=#98bb6c]}#[bg=#282727,bold]  #S #[default] #{?#{S:#{W:#{@agent_state}}},#[fg=#737c73]󰂚 #{S:#{W:#{?@agent_state,#{?#{==:#{@agent_state},input},#[fg=#ffa066]󰋗 ,#[fg=#98bb6c]󰄬 }#{session_name}:#{window_name} ,}}}#[default],}"
set -g status-left-length 120
# #{@status_eq}: the audio equalizer, pushed by tmux-status-anim ~8x a second while
# audio plays (setting an option redraws at once; the #() output only every second)
set -g status-right "#[fg=#87a987,bg=#282727]  #{pane_current_path} #{?#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD),#[fg=#c5c9c5]on #[fg=#a292a3] #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD),} #[fg=#c5c9c5,bg=#282727] 󱩊 #(whoami)@#H #[bg=#282727]#(~/.local/bin/tmux-status-anim --stream)#{@status_eq} #[fg=#b6927b,bg=#282727]  %H:%M "
# Redraw every second so the status-right animation moves (default is 15s)
set -g status-interval 1

# --- Session switching ---
# Direct jumps to the sessions tmux-start creates
bind R switch-client -t root-claude
bind S switch-client -t servers
bind W switch-client -t snipe-it     # web
bind A switch-client -t snipe-mobile # app
# Showcase session (animations), built on first use since it costs CPU while running
bind V run-shell "~/.local/bin/tmux-showcase" \; switch-client -t showcase

# Toggle between the two most recent sessions (also on the default prefix + L)
bind Tab switch-client -l

# fzf picker over all sessions and windows, with a live pane preview
bind j display-popup -E -w 70% -h 70% "~/.local/bin/tmux-session-menu"

# Cheat sheet, like nvim's <leader>?. Replaces the default list-keys on this key;
# prefix + / still describes any single key. Border and title match nvim's floats.
bind ? display-popup -E -b rounded -S "fg=#7e9cd8" -T "#[fg=#7e9cd8,bold] tmux Cheat Sheet " -w 102 -h 36 "~/.local/bin/tmux-cheatsheet"

# Killing a session drops you into another one instead of detaching tmux
set -g detach-on-destroy off

# --- Screensaver ---
# After 3.5 idle minutes tmux "locks" the session by running a random animation
# (wave, bonsai, pipes, matrix, stars, aquarium, visualizer). j/k or arrows switch, qq exits
# Keep this below the macOS screen saver delay (10 min): when that starts, Ghostty
# loses focus, and the focus-out event counts as input and restarts this timer.
# Mouse movement over a Claude Code pane (it turns on motion tracking) also counts.
set -g lock-after-time 210
set -g lock-command "~/.local/bin/tmux-screensaver"
bind B lock-client   # start it now
# Locking only covers the clients attached at the time, so one that attaches to a
# session another client has locked (e.g. mosh from the iPad) starts locked too
set-hook -g client-attached[90] 'run-shell -b "~/.local/bin/tmux-screensaver --join #{q:session_name} #{q:client_name}"'
# Audio visualizer (cava, system audio via a Core Audio tap); q closes it
# Status-right animation: agent spinners, an equalizer while audio plays, else a
# scene (koi, petals, moon, bonsai); prefix + a switches scene
bind a run-shell "~/.local/bin/tmux-status-anim next"
bind v display-popup -E -b rounded -S "fg=#7e9cd8" -T "#[fg=#7e9cd8,bold] cava " -w 80% -h 60% "/opt/homebrew/bin/cava"

# --- Agent notifications ---
# Claude Code and Codex hooks run tmux-agent-notify when an agent finishes (green
# check) or is waiting on you (orange ?). Flagged windows are listed in status-left
# across every session, and marked on their tab, until you visit them or reply.
set -g window-status-format "#[fg=#c5c9c5,italics] #I: #W #{?@agent_state,#{?#{==:#{@agent_state},input},#[fg=#ffa066]󰋗 ,#[fg=#98bb6c]󰄬 },}"
# Visiting a window clears its flag. Indexed so re-sourcing replaces, not appends.
set-hook -g session-window-changed[90] 'run-shell -b "~/.local/bin/tmux-agent-notify seen #{window_id}"'
set-hook -g client-session-changed[90] 'run-shell -b "~/.local/bin/tmux-agent-notify seen #{window_id} #{client_name}"'
bind N run-shell "~/.local/bin/tmux-agent-notify jump"   # oldest notification
